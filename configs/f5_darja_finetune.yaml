# F5-TTS fine-tune config for commercial Algerian/Maghrebi Darja seed (M2)
# Real upstream trainer: python -m f5_tts.train.finetune_cli (see data/f5_datasets/TRAIN_COMMAND.sh)

exp_name: F5TTS_v1_Base
dataset_name: darja_commercial
tokenizer: custom
learning_rate: 1.0e-5
batch_size_per_gpu: 800
batch_size_type: frame
max_samples: 32
grad_accumulation_steps: 4
epochs: 50
num_warmup_updates: 300
save_per_updates: 500
last_per_updates: 200
val_fraction: 0.08
# Optional: path to NightPrince / other Arabic F5 init weights
pretrain: null
# Licensing: train only research_and_commercial_with_attribution (exclude Casablanca NC-ND)
allowed_use: research_and_commercial_with_attribution

# GPU guidance (CPU host cannot product-train)
recommended_gpu: "1x 24GB (RTX 4090 / A5000+)"
minimum_gpu: "1x 16GB with lower frame batch + grad accum"
